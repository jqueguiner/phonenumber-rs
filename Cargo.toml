[package]
name = "phonenumber-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A Rust rewrite of Google's libphonenumber: parse, validate, and format international phone numbers, with full calling-code/region metadata, geocoding, and JSON analysis."
license = "Apache-2.0"
repository = "https://github.com/jqueguiner/phonenumber-rs"
readme = "README.md"
keywords = ["phone", "phonenumber", "libphonenumber", "e164", "telephone"]
categories = ["parsing", "internationalization"]
exclude = ["upstream/", "/.github", "*.bk"]

[lib]
name = "phonenumber"

[dependencies]
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[build-dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
