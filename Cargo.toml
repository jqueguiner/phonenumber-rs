[package]
name = "phonenumber"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A Rust rewrite of Google's libphonenumber: parse, validate, and format international phone numbers, with full calling-code/region metadata."
license = "Apache-2.0"
repository = "https://example.invalid/phonenumber"
keywords = ["phone", "phonenumber", "libphonenumber", "e164", "telephone"]
categories = ["parsing", "internationalization"]

[dependencies]
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[build-dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
